[tool.isort]
import_heading_stdlib = "Standard library imports"
import_heading_thirdparty = "Third-party imports"
import_heading_firstparty = "Local imports"
import_heading_localfolder = "Local folder imports"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 79
lines_after_imports = 2
skip = [".infra"]

[tool.black]
line-length = 79
target-version = ["py311"]
workers = 4
extend-exclude = '''/(
    \.cursor
    | \.github
    | \.infra
    | \.scannerwork
    | \.sonarlint
    | \.vscode
    | data
    | .*\.ipynb$
)/
'''

[project]
name = "thesis"
version = "3.11.0"
description = ""
authors = [{name = "Sviatoslav", email = "sviatoslav.kru@gmail.com"}]
readme = "README.md"

[tool.poetry]
name = "thesis"
version = "3.11.0"
description = ""
packages = [{include = "chatbot"}, {include = "ui"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pydantic = ">=2.12.4,<3.0.0"
easyocr = ">=1.7.2,<2.0.0"
openai = ">=2.7.1,<3.0.0"
chromadb = ">=1.3.4,<2.0.0"
docling = ">=2.61.1,<3.0.0"
langchain-text-splitters = ">=1.0.0,<2.0.0"
pillow = "==11.0.0"
docling-core = ">=2.50.1,<3.0.0"
pydantic-settings = ">=2.11.0,<3.0.0"
loguru = ">=0.7.3,<0.8.0"
fastapi = ">=0.121.0,<0.122.0"
python-multipart = "^0.0.20"
streamlit = ">=1.28.0"
requests = ">=2.31.0"
pandas = ">=2.0.0"
python-dotenv = ">=1.0.0"

torch = { version = "2.8.0", source = "pytorch-cu129" }
torchvision = { version = "0.23.0", source = "pytorch-cu129" }
torchaudio = { version = "2.8.0", source = "pytorch-cu129" }
langsmith = "^0.4.49"
python-doc = "^2020.10.1"
python-docx = "^1.2.0"
docx = "^0.2.4"
pywin32 = "^311"
datasets = "^4.4.1"
huggingface-hub = ">=0.23,<1"

[[tool.poetry.source]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "chatbot.main:main"
ui = "ui:main"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0,<8.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "ipywidgets>=8.1.8,<9.0.0",
    "isort>=7.0.0,<8.0.0",
    "black>=25.9.0,<26.0.0",
]